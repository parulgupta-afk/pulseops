# Local dev infra for PulseOps.
# Postgres image includes pgvector (needed from Phase 5 onward, but we set it up now
# so the extension is available and migrations don't need to change later).
version: "3.8"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulseops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
      POSTGRES_DB: pulseops
    ports:
      - "5432:5432"
    volumes:
      - pulseops_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pulseops_pg_data:
